<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>DATABASE</title>
    <script>
      // GitHub Pages serves this file for unknown paths. Send the path back to
      // index.html so the SPA router can read it. pathSegmentsToKeep = 1 keeps
      // the /database-portal/ project-site prefix.
      // Pattern: https://github.com/rafgraph/spa-github-pages (MIT)
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
